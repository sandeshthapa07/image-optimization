<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card grid example</title>
  <style>
    img { max-width: 100%; height: auto; display: block; }

    /* Layout used to calculate sizes:
       container max 1200px, padding 24px each side, gap 24px
       1 column < 640px, 2 columns >= 640px, 3 columns >= 1024px */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
    @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    /* Same shape for every card, whatever the photo's ratio */
    .card__media { aspect-ratio: 4 / 3; overflow: hidden; border-radius: 12px; background: #e5e7eb; }
    .card__media img { width: 100%; height: 100%; object-fit: cover; }

    /* Fixed-size avatar */
    .author { display: flex; align-items: center; gap: 8px; }
    .author img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="grid">
      <article class="card">
        <div class="card__media">
          <!--
            Role: below the fold
            sizes, from the CSS:
              >= 1248px: (1200 - 2 gaps x 24) / 3 = 384px
              >= 1024px: (100vw - 48px padding - 48px gaps) / 3
              >=  640px: (100vw - 48px padding - 24px gap) / 2
              otherwise: 100vw - 48px padding
            "auto," first: Chromium uses the real layout width for lazy images
          -->
          <img
            src="/images/card-1-640.jpg"
            srcset="/images/card-1-320.jpg 320w,
                    /images/card-1-480.jpg 480w,
                    /images/card-1-640.jpg 640w,
                    /images/card-1-960.jpg 960w"
            sizes="auto,
                   (min-width: 1248px) 384px,
                   (min-width: 1024px) calc((100vw - 96px) / 3),
                   (min-width: 640px) calc((100vw - 72px) / 2),
                   calc(100vw - 48px)"
            width="960" height="720"
            alt="Mountain lake at sunrise"
            loading="lazy" decoding="async">
        </div>
        <h2>Card title</h2>
        <div class="author">
          <!-- Role: fixed size. x descriptors, no sizes -->
          <img src="/images/avatar-32.jpg" srcset="/images/avatar-32.jpg 1x, /images/avatar-64.jpg 2x"
               width="32" height="32" alt="Jane Doe" aria-hidden="true" loading="lazy" decoding="async">
          <!-- Filled alt (policy) + aria-hidden: the name is next to it, so screen readers skip the duplicate -->
          <span>Jane Doe</span>
        </div>
      </article>
      <!-- more cards ... -->
    </div>
  </div>
</body>
</html>
