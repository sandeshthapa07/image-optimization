<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eval 01: stretched images</title>
  <style>
    .post img { width: 100%; }                      /* bug: no height: auto */
    .thumb { width: 300px; height: 200px; }          /* bug: no object-fit, photos are 4:5 */
    .media { display: flex; gap: 16px; }
    .media img { width: 160px; height: 160px; }      /* bug: shrinks in the flex row, no object-fit */
  </style>
</head>
<body>
  <article class="post">
    <img src="/images/article-1600.jpg" width="1600" height="900" alt="City skyline at night">
  </article>

  <section>
    <img class="thumb" src="/images/portrait-800.jpg" width="800" height="1000" alt="Portrait of the author">
  </section>

  <section class="media">
    <img src="/images/product-640.jpg" width="640" height="480" alt="Blue backpack">
    <p>Long product description text that takes most of the row width and makes the image shrink on small screens ...</p>
  </section>

  <section>
    <img src="/images/team.jpg" style="width: 100%; height: 320px" width="1200" height="800" alt="Our team">
  </section>
</body>
</html>
